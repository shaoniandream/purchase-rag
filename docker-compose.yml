services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: purchase-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password_123
      POSTGRES_DB: purchase_rag
    ports:
      - "5432:5432"
    volumes:
      - purchase_pgdata:/var/lib/postgresql/data

volumes:
  purchase_pgdata:
